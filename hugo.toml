# -- 站点配置 --
# 根域名部署，详见 DEPLOY.md
baseURL = "https://hanchangzhang.top/"
title = "Ken 的博客"
theme = "blowfish"

defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

enableEmoji = true
enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

# 文章 URL 格式：/2026/08/文章名/
[permalinks]
  posts = "/:year/:month/:slugorfilename/"

[pagination]
  pagerSize = 12

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

# JSON 输出给站内搜索用
[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

# 相关文章推荐
[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "series"
    weight = 50

  [[related.indices]]
    name = "authors"
    weight = 20

  [[related.indices]]
    name = "date"
    weight = 10
