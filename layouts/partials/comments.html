{{/*
  Giscus 评论（基于 GitHub Discussions）
  启用步骤：
  1. 仓库 Settings -> General -> Features 勾选 Discussions
  2. 安装 giscus app: https://github.com/apps/giscus
  3. 到 https://giscus.app 生成配置，把下面四个占位值替换掉
  4. config/_default/params.toml 里 [article] showComments 改为 true
*/}}
<section class="giscus pt-4">
  <script
    src="https://giscus.app/client.js"
    data-repo="Jack-Ken/blog"
    data-repo-id="替换为giscus.app生成的REPO_ID"
    data-category="Announcements"
    data-category-id="替换为giscus.app生成的CATEGORY_ID"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="zh-CN"
    data-loading="lazy"
    crossorigin="anonymous"
    async
  ></script>
</section>
