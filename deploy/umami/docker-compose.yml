# Umami 自托管访问统计
# 用法：把整个目录拷到服务器上，然后 docker compose up -d
# 默认端口 3000，建议在 Nginx 里反代到 umami.hanchangzhang.top（见下方说明）

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgres:umami@db:5432/umami
      DATABASE_TYPE: postgresql
      # 部署前务必改成随机字符串：openssl rand -base64 32
      APP_SECRET: REPLACE_WITH_RANDOM_SECRET
    ports:
      - "127.0.0.1:3000:3000" # 只监听本机，由 Nginx 反代对外
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      # 同样建议改成强密码（并同步修改上面的 DATABASE_URL）
      POSTGRES_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
    volumes:
      - umami-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  umami-db:

# ---------------------------------------------------------------------------
# 反代配置：在 Nginx 中新增一个 server 块（或用 certbot 生成后再加）：
#
#   server {
#       listen 443 ssl;
#       server_name umami.hanchangzhang.top;
#       location / {
#           proxy_pass http://127.0.0.1:3000;
#           proxy_set_header Host $host;
#           proxy_set_header X-Real-IP $remote_addr;
#           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       }
#   }
#
# 1. DNS 里给 umami.hanchangzhang.top 加一条 A 记录指向服务器 IP
# 2. sudo certbot --nginx -d umami.hanchangzhang.top
# 3. 浏览器打开 https://umami.hanchangzhang.top，默认账号 admin / umami（登录后立即改密码）
# 4. Umami 后台添加网站 -> 拿到 data-website-id ->
#    回到博客 hugo.toml，取消注释 params.analytics.umami 并填入
# ---------------------------------------------------------------------------
