# HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hanchangzhang.top www.hanchangzhang.top;

    return 301 https://$server_name$request_uri;
}

# HTTPS 提供静态文件
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hanchangzhang.top www.hanchangzhang.top;

    ssl_certificate /etc/nginx/ssl/hanchangzhang.top.pem;
    ssl_certificate_key /etc/nginx/ssl/hanchangzhang.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # GitHub Actions rsync 同步的目标目录
    root /var/www/blog;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存
    location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;
}