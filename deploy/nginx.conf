# Nginx 站点配置 —— 部署到服务器时复制到 /etc/nginx/sites-available/blog
# 然后: ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
# 首次跑通 HTTP 后，用 certbot 一键加 HTTPS（它会自动改写这个文件）:
#   sudo certbot --nginx -d hanchangzhang.top -d www.hanchangzhang.top

server {
    listen 80;
    listen [::]:80;
    server_name hanchangzhang.top www.hanchangzhang.top;

    # GitHub Actions rsync 同步的目标目录
    root /var/www/blog;
    index index.html;

    # gzip 压缩，减小传输体积
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（文件名带 hash 的可以放心设长）
    location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存，保证发布后立刻可见
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 加上访问日志（方便排查，也可对接 GoAccess 等分析工具）
    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;
}
